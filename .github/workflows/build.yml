name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Setup Gradle 8.0.2
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: 8.0.2
    - name: Fix settings.gradle repository conflict
      run: |
        sed -i '/dependencyResolutionManagement/,/^}/ s/^/\/\//' settings.gradle
    - name: Fix Xposed dependency repository
      run: |
        sed -i '/allprojects {/a\    repositories {\n        maven { url "https://api.xposed.info/" }\n    }' build.gradle
    - name: Fix missing launcher icon
      run: |
        sed -i '/android:icon="@mipmap/d' app/src/main/AndroidManifest.xml
        sed -i '/android:roundIcon="@mipmap/d' app/src/main/AndroidManifest.xml
    - name: Build with Gradle
      run: gradle assembleDebug
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
