name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Setup Gradle (compatible version)
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 7.5.1
    - name: Fix settings.gradle repository conflict
      run: |
        # Comment out the entire dependencyResolutionManagement block
        sed -i '/dependencyResolutionManagement/,/^}/ s/^/\/\//' settings.gradle
    - name: Build with Gradle
      run: gradle assembleDebug
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
